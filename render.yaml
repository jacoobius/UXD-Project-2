services:
  - type: web
    name: steadily
    runtime: node
    plan: starter
    buildCommand: node scripts/check.mjs
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/steadily.sqlite
      - key: TRUST_PROXY
        value: "1"
      - key: STEADILY_AI_ENABLED
        value: "0"
    disk:
      name: steadily-data
      mountPath: /var/data
      sizeGB: 1
